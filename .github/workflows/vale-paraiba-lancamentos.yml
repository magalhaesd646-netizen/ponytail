name: vale-paraiba-lancamentos

on:
  schedule:
    # 11:00 UTC ~= 08:00 horário de Brasília (UTC-3, sem horário de verão).
    # A cada 3 dias (dias 1,4,7,... do mês) — volume de lançamentos não
    # justifica rodar todo dia e isso também poupa cota de busca.
    - cron: '0 11 */3 * *'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: vale-paraiba-lancamentos

jobs:
  # Busca os lançamentos, abre a Issue de alerta e salva o estado. Não
  # depende do GitHub Pages estar habilitado — roda e funciona mesmo que o
  # deploy do painel (job seguinte) ainda não esteja configurado.
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commitar data/seen.json
      issues: write # abrir a Issue de alerta (canal padrão, zero-config)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Rodar monitor de lançamentos
        env:
          # Canal de alerta padrão (Issues) — não precisa configurar nada,
          # o Actions já injeta esse token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Upgrade de busca web (ver README) — recomendado: sem ele, Viva
          # Real/ZAP costumam bloquear as requisições vindas do Actions
          # (HTTP 403) e a busca real fica praticamente zerada. Use o Tavily
          # (mais simples) OU o Google; deixe os secrets vazios/ausentes para
          # rodar só no modo zero-config (portais públicos + Issues).
          TAVILY_API_KEY: ${{ secrets.VALE_TAVILY_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.VALE_GOOGLE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.VALE_GOOGLE_CSE_ID }}
          SEARCH_DAILY_QUERY_BUDGET: '30'
          SMTP_HOST: ${{ secrets.VALE_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.VALE_SMTP_PORT }}
          SMTP_USER: ${{ secrets.VALE_SMTP_USER }}
          SMTP_PASS: ${{ secrets.VALE_SMTP_PASS }}
          SMTP_FROM: ${{ secrets.VALE_SMTP_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.VALE_ALERT_EMAIL_TO }}
        run: npm start

      - name: Salvar estado atualizado (lançamentos já notificados)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no estado."
          else
            git commit -m "chore: atualiza estado de lançamentos monitorados"
            git push
          fi

      - name: Incluir app de investimentos no mesmo painel
        run: cp -r ../investimentos web/investimentos

      - name: Publicar painel como artefato (para o job de deploy)
        uses: actions/upload-artifact@v4
        with:
          name: pages-web
          path: vale-paraiba-lancamentos/web
          retention-days: 1

  # Job separado: só mexe com o GitHub Pages. Se o Pages ainda não estiver
  # habilitado em Settings → Pages → Source → "GitHub Actions", só ESTE job
  # falha — a busca/alerta do job "run" acima já rodou normalmente.
  deploy-pages:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar painel gerado
        uses: actions/download-artifact@v4
        with:
          name: pages-web
          path: web

      - uses: actions/configure-pages@v5

      - name: Empacotar painel web
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
