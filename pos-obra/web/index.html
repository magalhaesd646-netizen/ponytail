<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pós-Obra</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf3f2;
    --card: #ffffff;
    --text: #2a1717;
    --muted: #8a7370;
    --border: #f0dedb;
    --accent: #d9482f;
    --accent-bg: #fbe4df;
    --brand-dark: #7a1f1f;
    --brand-darker: #551313;
    --shadow: 0 1px 3px rgba(122, 31, 31, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1210;
      --card: #2a1c19;
      --text: #f5e9e6;
      --muted: #c2a49e;
      --border: #43302b;
      --accent: #ea6a4d;
      --accent-bg: #3a2420;
      --brand-dark: #ea6a4d;
      --brand-darker: #2a1c19;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .app { display: flex; align-items: flex-start; min-height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--brand-dark), var(--brand-darker));
    color: #fff;
    padding: 26px 16px;
    position: sticky;
    top: 0;
  }
  .brand { text-align: center; margin-bottom: 30px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,.15);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem; margin: 0 auto 10px;
  }
  .brand-name { font-weight: 700; font-size: 0.9rem; letter-spacing: .02em; }
  .brand-sub { font-size: 0.65rem; opacity: .75; text-transform: uppercase; letter-spacing: .1em; margin-top: 2px; }
  .side-nav { display: flex; flex-direction: column; gap: 4px; }
  .side-nav button {
    display: flex; align-items: center; gap: 10px;
    background: none; border: none; color: rgba(255,255,255,.82);
    padding: 10px 12px; border-radius: 8px;
    font-size: 0.82rem; text-align: left; cursor: pointer;
  }
  .side-nav button .icon { font-size: 1rem; width: 18px; text-align: center; }
  .side-nav button.active { background: rgba(255,255,255,.16); color: #fff; font-weight: 600; }
  .side-nav button:hover:not(.active) { background: rgba(255,255,255,.08); }

  /* ---- Content ---- */
  .content { flex: 1; min-width: 0; padding: 26px 28px 50px; max-width: 1280px; }
  .page-header {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start;
    gap: 16px; margin-bottom: 22px;
  }
  .brand-kicker {
    display: block;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 6px;
  }
  h1 { margin: 0 0 4px; font-size: 1.4rem; color: var(--brand-dark); }
  .page-header p { margin: 0; color: var(--muted); font-size: 0.88rem; max-width: 50ch; }
  .header-meta { display: flex; flex-wrap: wrap; gap: 10px; }
  .meta-box {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; box-shadow: var(--shadow); min-width: 130px;
  }
  .meta-label { display: block; font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .meta-value { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 2px; }
  a.external-link {
    color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600;
    align-self: center; white-space: nowrap;
  }
  a.external-link:hover { text-decoration: underline; }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .card h2 { margin: 0 0 4px; font-size: 0.85rem; letter-spacing: .02em; color: var(--brand-dark); text-transform: uppercase; }
  .card .card-sub { margin: 0 0 14px; font-size: 0.78rem; color: var(--muted); }

  .grid { display: grid; gap: 16px; margin-bottom: 16px; }
  .grid-2 { grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.6fr); }
  @media (max-width: 820px) { .grid-2 { grid-template-columns: 1fr; } }

  /* ---- Donut ---- */
  .donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .donut { width: 150px; height: 150px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut::after {
    content: ''; position: absolute; inset: 22px; border-radius: 50%; background: var(--card);
  }
  .donut-legend { flex: 1; min-width: 170px; }
  .legend-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; margin-bottom: 9px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend-name { flex: 1; }
  .legend-value { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
  .donut-total { text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .donut-total .stat-value { font-size: 1.9rem; font-weight: 700; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
  .donut-total .stat-label { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  /* ---- Column chart ---- */
  .col-chart-toolbar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
  .col-chart-toolbar input[type="search"] {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.8rem; width: 180px;
  }
  .col-chart {
    display: flex; align-items: flex-end; gap: 14px;
    height: 200px; overflow-x: auto; padding: 0 30px 46px 40px;
  }
  .col-chart .col {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    height: 100%; min-width: 30px; flex: 1 0 30px; position: relative;
  }
  .col-chart .col .col-value {
    font-size: 0.7rem; margin-bottom: 4px; color: var(--text);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .col-chart .col .col-bar { width: 20px; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col-chart .col .col-label {
    position: absolute; top: 100%; margin-top: 8px; left: 50%;
    transform: translateX(-50%) rotate(-42deg); transform-origin: top center;
    font-size: 0.66rem; color: var(--muted); white-space: nowrap; max-width: 90px;
  }

  /* ---- Raw table (Vistorias / Agenda, sem resumo ainda) ---- */
  .panel-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .panel-toolbar[hidden] { display: none; }
  .panel-toolbar input[type="search"] {
    flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 0.9rem;
  }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card); box-shadow: var(--shadow); }
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th { background: var(--accent-bg); color: var(--brand-dark); position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: none; }
  .empty-state {
    padding: 40px 20px; text-align: center; color: var(--muted);
    border: 1px dashed var(--border); border-radius: 12px; background: var(--card);
  }
  .summary-wrap { display: none; }
  .summary-wrap.visible { display: block; }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">SA</div>
      <div class="brand-name">Sousa Araújo</div>
      <div class="brand-sub">Construtora</div>
    </div>
    <nav class="side-nav" id="tabs"></nav>
  </aside>
  <div class="content">
    <header class="page-header">
      <div>
        <span class="brand-kicker">Construtora Sousa Araújo</span>
        <h1 id="page-title">Pós-Obra</h1>
        <p id="page-subtitle">Painel de acompanhamento, atualizado automaticamente todo dia.</p>
      </div>
      <div class="header-meta">
        <div class="meta-box" id="periodo-box" hidden>
          <span class="meta-label">Período</span>
          <span class="meta-value" id="periodo-value">—</span>
        </div>
        <div class="meta-box">
          <span class="meta-label">Atualizado em</span>
          <span class="meta-value" id="updated-at-value">—</span>
        </div>
        <a class="external-link" id="external-link" target="_blank" rel="noopener" hidden>Abrir link externo ↗</a>
      </div>
    </header>
    <main id="panels"></main>
  </div>
</div>

<script>
const FAMILIA_COLORS = {
  'Hidráulica': '#d9482f',
  'Elétrica': '#e8a33d',
  'Esquadrias (portas/janelas)': '#7a1f1f',
  'Acabamento/Estrutural': '#e8938a',
  'Marcenaria': '#c9beb8',
  'Outros': '#9c8b83',
};
const MODELO_COLORS = {
  'QUALIDADE - VISTORIA UNIDADE': '#d9482f',
  'QUALIDADE - VISTORIA RECEBIMENTO': '#e8a33d',
  'PÓS OBRA - VISTORIA RECEBIMENTO': '#7a1f1f',
};
const FALLBACK_COLOR = '#9c8b83';

const TABS = [
  {
    id: 'pos-obra',
    label: 'Pós-Obra',
    icon: '🛠️',
    subtitle: 'Acompanhe os chamados de assistência técnica por empreendimento e família.',
    summaryLayout: {
      totalKey: 'totalChamados',
      totalLabel: 'chamados no total',
      donut: {
        key: 'porFamilia',
        labelKey: 'familia',
        colors: FAMILIA_COLORS,
        title: 'Família dos chamados',
        subtitle: 'Distribuição por tipo de problema',
      },
      columns: {
        key: 'porEmpreendimento',
        labelKey: 'empreendimento',
        title: 'Chamados por empreendimento',
        subtitle: 'Quantidade de chamados abertos, por empreendimento',
        searchPlaceholder: 'Buscar empreendimento...',
      },
      monthly: {
        key: 'porMes',
        labelKey: 'mes',
        title: 'Chamados por mês',
        subtitle: 'Últimos 12 meses, pela data de abertura',
      },
    },
  },
  {
    id: 'vistorias',
    label: 'Vistorias de Qualidade e Pós-Obra',
    icon: '📋',
    subtitle: 'Não conformidades identificadas nas vistorias, por obra e por tipo.',
    summaryLayout: {
      totalKey: 'totalNC',
      totalLabel: 'não conformidades no total',
      donut: {
        key: 'porModelo',
        labelKey: 'modelo',
        colors: MODELO_COLORS,
        title: 'Não conformidades por tipo de vistoria',
        subtitle: 'Distribuição geral',
      },
      columns: {
        key: 'porObra',
        labelKey: 'obra',
        title: 'Não conformidades por obra',
        subtitle: 'Quantidade de NC, por obra',
        searchPlaceholder: 'Buscar obra...',
      },
      monthly: {
        key: 'porMes',
        labelKey: 'mes',
        title: 'Não conformidades por mês',
        subtitle: 'Últimos 12 meses, pela data da vistoria',
      },
    },
  },
  { id: 'agenda', label: 'Agenda Pós-Obra', icon: '🗓️', subtitle: 'Dados da planilha de agenda.' },
];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const pageTitle = document.getElementById('page-title');
const pageSubtitle = document.getElementById('page-subtitle');
const periodoBox = document.getElementById('periodo-box');
const periodoValue = document.getElementById('periodo-value');
const updatedAtValue = document.getElementById('updated-at-value');
const externalLinkEl = document.getElementById('external-link');
const state = {};

function formatDate(iso) {
  if (!iso) return 'nunca';
  return new Date(iso).toLocaleString('pt-BR');
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function renderDonut(panel, items, { labelKey, colors }) {
  let acc = 0;
  const stops = items.map((item) => {
    const color = colors[item[labelKey]] || FALLBACK_COLOR;
    const start = acc;
    acc += item.percentual;
    return `${color} ${start}% ${acc}%`;
  });
  panel.querySelector('.donut').style.background = `conic-gradient(${stops.join(', ')})`;
  panel.querySelector('.donut-legend').innerHTML = items
    .map(
      (item) => `
        <div class="legend-row">
          <span class="legend-swatch" style="background:${colors[item[labelKey]] || FALLBACK_COLOR}"></span>
          <span class="legend-name">${escapeHtml(item[labelKey])}</span>
          <span class="legend-value">${item.percentual}% (${item.total.toLocaleString('pt-BR')})</span>
        </div>`
    )
    .join('');
}

function renderColumnChart(container, items, { labelKey, valueKey }) {
  const max = Math.max(1, ...items.map((item) => item[valueKey]));
  container.innerHTML = items
    .map(
      (item) => `
        <div class="col">
          <span class="col-value">${item[valueKey].toLocaleString('pt-BR')}</span>
          <span class="col-bar" style="height:${(item[valueKey] / max) * 100}%"></span>
          <span class="col-label" title="${escapeHtml(item[labelKey])}">${escapeHtml(item[labelKey])}</span>
        </div>`
    )
    .join('');
}

function renderSummary(panel, data, layout, search) {
  const summary = data.summary;
  const columnItems = search
    ? summary[layout.columns.key].filter((item) => item[layout.columns.labelKey].toLowerCase().includes(search))
    : summary[layout.columns.key];

  panel.querySelector('.donut-total .stat-value').textContent = summary[layout.totalKey].toLocaleString('pt-BR');
  renderDonut(panel, summary[layout.donut.key], layout.donut);
  renderColumnChart(panel.querySelector('.by-columns'), columnItems, {
    labelKey: layout.columns.labelKey,
    valueKey: 'total',
  });

  const porMes = layout.monthly && summary[layout.monthly.key];
  if (porMes) {
    renderColumnChart(panel.querySelector('.by-mes'), porMes.slice(-12), {
      labelKey: layout.monthly.labelKey,
      valueKey: 'total',
    });
  }

  // Guardado no painel (não escrito direto no header compartilhado) — só
  // vira visível quando esta aba estiver ativa, via syncHeader. Escrever
  // direto aqui vazaria o período de uma aba pra outra: toda aba recarrega
  // os dados em paralelo no init, então a última a responder "vencia" no
  // header inteiro, mesmo se não fosse a aba aberta na tela.
  panel.dataset.periodo =
    porMes && porMes.length ? `${porMes[0][layout.monthly.labelKey]} – ${porMes[porMes.length - 1][layout.monthly.labelKey]}` : '';
}

function renderTable(panel, data) {
  const tableWrap = panel.querySelector('.table-wrap');
  const summaryWrap = panel.querySelector('.summary-wrap');
  const panelToolbar = panel.querySelector('.panel-toolbar');
  const emptyState = panel.querySelector('.empty-state');

  if (data.summary && panel.summaryLayout) {
    const columnsSearchInput = panel.querySelector('.col-chart-toolbar input[type="search"]');
    const search = (columnsSearchInput && columnsSearchInput.value || '').trim().toLowerCase();
    tableWrap.hidden = true;
    panelToolbar.hidden = true;
    summaryWrap.classList.add('visible');
    emptyState.hidden = true;
    renderSummary(panel, data, panel.summaryLayout, search);
    return;
  }
  summaryWrap.classList.remove('visible');
  panelToolbar.hidden = false;
  panel.dataset.periodo = '';

  const tableSearchInput = panel.querySelector('.panel-toolbar input[type="search"]');
  const search = (tableSearchInput && tableSearchInput.value || '').trim().toLowerCase();
  const rows = search
    ? data.rows.filter((row) => Object.values(row).some((v) => String(v).toLowerCase().includes(search)))
    : data.rows;

  if (!data.columns.length || !rows.length) {
    tableWrap.hidden = true;
    emptyState.hidden = false;
    emptyState.textContent = !data.configured
      ? 'Planilha ainda não configurada para esta aba (ver .env.example / segredos do GitHub Actions).'
      : !data.columns.length
      ? 'Sem dados retornados pela planilha ainda.'
      : 'Nenhuma linha corresponde à busca.';
    return;
  }

  tableWrap.hidden = false;
  emptyState.hidden = true;
  const thead = `<thead><tr>${data.columns.map((c) => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>`;
  const tbody = `<tbody>${rows
    .map((row) => `<tr>${data.columns.map((c) => `<td>${escapeHtml(row[c])}</td>`).join('')}</tr>`)
    .join('')}</tbody>`;
  tableWrap.querySelector('table').innerHTML = thead + tbody;
}

async function loadTab(tab, links) {
  const panel = document.getElementById(`panel-${tab.id}`);
  let data = { configured: false, updatedAt: null, columns: [], rows: [] };
  try {
    const res = await fetch(`./data/${tab.id}.json?_=${Date.now()}`);
    if (res.ok) data = await res.json();
  } catch (err) {
    console.error(`Falha ao carregar dados de ${tab.id}`, err);
  }
  state[tab.id] = data;
  panel.dataset.updatedAt = data.updatedAt || '';

  const link = links && links[tab.id];
  panel.dataset.externalLink = link || '';

  renderTable(panel, data);
  if (panel.classList.contains('active')) syncHeader(tab, panel);
}

function syncHeader(tab, panel) {
  pageTitle.textContent = tab.label;
  pageSubtitle.textContent = tab.subtitle || '';
  updatedAtValue.textContent = formatDate(panel.dataset.updatedAt);
  const link = panel.dataset.externalLink;
  if (link) {
    externalLinkEl.href = link;
    externalLinkEl.hidden = false;
  } else {
    externalLinkEl.hidden = true;
  }
  const periodo = panel.dataset.periodo;
  if (periodo) {
    periodoBox.hidden = false;
    periodoValue.textContent = periodo;
  } else {
    periodoBox.hidden = true;
  }
}

function buildSummaryMarkup(layout) {
  if (!layout) return '';
  return `
    <div class="summary-wrap">
      <div class="grid grid-2">
        <div class="card">
          <h2>${escapeHtml(layout.donut.title)}</h2>
          <p class="card-sub">${escapeHtml(layout.donut.subtitle)}</p>
          <div class="donut-wrap">
            <div class="donut"></div>
            <div class="donut-legend"></div>
          </div>
          <div class="donut-total">
            <div class="stat-value">0</div>
            <div class="stat-label">${escapeHtml(layout.totalLabel)}</div>
          </div>
        </div>
        <div class="card">
          <h2>${escapeHtml(layout.columns.title)}</h2>
          <p class="card-sub">${escapeHtml(layout.columns.subtitle)}</p>
          <div class="col-chart-toolbar">
            <input type="search" placeholder="${escapeHtml(layout.columns.searchPlaceholder || 'Buscar...')}" />
          </div>
          <div class="col-chart by-columns"></div>
        </div>
      </div>
      ${
        layout.monthly
          ? `<div class="card">
        <h2>${escapeHtml(layout.monthly.title)}</h2>
        <p class="card-sub">${escapeHtml(layout.monthly.subtitle)}</p>
        <div class="col-chart by-mes"></div>
      </div>`
          : ''
      }
    </div>
  `;
}

function buildPanel(tab) {
  const panel = document.createElement('section');
  panel.className = 'panel';
  panel.id = `panel-${tab.id}`;
  panel.summaryLayout = tab.summaryLayout || null;
  panel.innerHTML = `
    ${buildSummaryMarkup(tab.summaryLayout)}
    <div class="panel-toolbar">
      <input type="search" placeholder="Buscar em ${escapeHtml(tab.label)}..." />
    </div>
    <div class="table-wrap"><table></table></div>
    <div class="empty-state" hidden></div>
  `;
  if (!panel.querySelector('.summary-wrap')) {
    panel.insertAdjacentHTML('afterbegin', '<div class="summary-wrap"></div>');
  }
  for (const input of panel.querySelectorAll('input[type="search"]')) {
    input.addEventListener('input', () => renderTable(panel, state[tab.id] || { columns: [], rows: [] }));
  }
  return panel;
}

function activateTab(id) {
  for (const btn of tabsEl.children) btn.classList.toggle('active', btn.dataset.id === id);
  const tab = TABS.find((t) => t.id === id);
  for (const panel of panelsEl.children) {
    const isActive = panel.id === `panel-${id}`;
    panel.classList.toggle('active', isActive);
    if (isActive) syncHeader(tab, panel);
  }
}

async function init() {
  let links = {};
  try {
    const res = await fetch(`./links.json?_=${Date.now()}`);
    if (res.ok) links = await res.json();
  } catch (err) {
    console.error('Falha ao carregar links.json', err);
  }

  for (const tab of TABS) {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="icon">${tab.icon}</span><span>${escapeHtml(tab.label)}</span>`;
    btn.dataset.id = tab.id;
    btn.addEventListener('click', () => activateTab(tab.id));
    tabsEl.appendChild(btn);
    panelsEl.appendChild(buildPanel(tab));
    loadTab(tab, links);
  }
  activateTab(TABS[0].id);
}

init();
</script>
</body>
</html>
