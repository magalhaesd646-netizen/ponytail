<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio de Times</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="scoreboard">
      <div class="crest"><img src="logo.png" alt="Football Amigos"></div>
      <h1 class="scoreboard__title">Sorteio de Times</h1>
    </header>

    <section class="card" id="paste-section">
      <label for="paste-area">Cole a lista de jogadores do grupo</label>
      <textarea id="paste-area" rows="7" placeholder="1. Fulano&#10;2. Beltrano (Goleiro)&#10;3. Ciclano"></textarea>
      <button id="load-btn" class="btn btn--teal">Carregar lista</button>
    </section>

    <section class="card" id="roster-section" hidden>
      <div class="roster-header">
        <h2>Escalação</h2>
        <p class="roster-hint">
          ⭐ marca os 3 ou 4 melhores (espalhados entre os times). 🧤 tira o
          goleiro do sorteio — identificamos automático, mas você pode
          corrigir tocando.
        </p>
      </div>
      <ol id="player-list" class="roster"></ol>

      <div class="draw-bar">
        <label class="team-size">
          Por time
          <input id="team-size" type="number" value="5" min="1" inputmode="numeric">
        </label>
        <button id="draw-btn" class="btn btn--accent">Sortear times</button>
      </div>
      <button id="clear-btn" class="btn btn--ghost">Recomeçar</button>
    </section>

    <section id="result-section" hidden>
      <div id="draw-result" class="teams"></div>
      <p id="goalkeepers-note" class="goalkeepers-note" hidden></p>

      <div class="card share-panel">
        <label for="share-text">Resultado pra colar no grupo</label>
        <textarea id="share-text" readonly rows="7"></textarea>
        <div class="share-actions">
          <button id="copy-btn" class="btn btn--accent">Copiar texto</button>
          <a id="whatsapp-btn" class="btn btn--sky" target="_blank" rel="noopener">Enviar no WhatsApp</a>
        </div>
      </div>
    </section>
  </main>
  <script src="../src/teamDraw.js"></script>
  <script src="app.js"></script>
</body>
</html>
