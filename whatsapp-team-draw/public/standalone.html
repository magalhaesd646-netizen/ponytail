<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sorteio de Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #f4f8fa;
  --surface: #ffffff;
  --teal: #014155;
  --teal-deep: #012b38;
  --accent: #e4b011;
  --accent-ink: #3a2600;
  --sky: #0aa6ef;
  --ink: #0b1f27;
  --ink-soft: #4d6470;
  --line: #dbe6ea;
  --team-1: #014155;
  --team-2: #e4b011;
  --team-3: #0aa6ef;
  --team-4: #c1272d;
  --team-5: #7a4fa3;
  --team-6: #1b6b3a;
  --shadow: 0 10px 24px -12px rgba(1, 65, 85, 0.35);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #071820;
    --surface: #102730;
    --teal: #2fb8d9;
    --teal-deep: #04303b;
    --accent: #ffc94d;
    --accent-ink: #2b1c00;
    --sky: #4fc3f7;
    --ink: #eaf3ec;
    --ink-soft: #93aab3;
    --line: #1d3941;
    --team-1: #2fb8d9;
    --team-2: #ffc94d;
    --team-3: #4fc3f7;
    --team-4: #ff6b6b;
    --team-5: #b48dde;
    --team-6: #3fcb7a;
    --shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.6);
  }
}

:root[data-theme="dark"] {
  --bg: #071820;
  --surface: #102730;
  --teal: #2fb8d9;
  --teal-deep: #eaf3ec;
  --accent: #ffc94d;
  --accent-ink: #2b1c00;
  --sky: #4fc3f7;
  --ink: #eaf3ec;
  --ink-soft: #93aab3;
  --line: #1d3941;
  --team-1: #2fb8d9;
  --team-2: #ffc94d;
  --team-3: #4fc3f7;
  --team-4: #ff6b6b;
  --team-5: #b48dde;
  --team-6: #3fcb7a;
  --shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.6);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Manrope", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

main {
  max-width: 520px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.scoreboard {
  text-align: center;
  padding: 1.5rem 1rem;
  border-radius: 18px;
  background: linear-gradient(160deg, var(--teal) 0%, var(--teal-deep) 100%);
  box-shadow: var(--shadow);
}

.crest {
  width: 132px;
  margin: 0 auto 0.85rem;
  padding: 10px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
}

.crest img {
  display: block;
  width: 100%;
  height: auto;
}

.scoreboard__title {
  margin: 0;
  font-family: "Anton", "Manrope", system-ui, sans-serif;
  font-weight: 400;
  font-size: clamp(1.8rem, 7vw, 2.3rem);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: #fff;
  text-wrap: balance;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

label {
  font-weight: 700;
  font-size: 0.95rem;
}

textarea {
  width: 100%;
  font: inherit;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 0.75rem;
  resize: vertical;
}

textarea:focus-visible,
input:focus-visible,
button:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.btn {
  border: none;
  border-radius: 999px;
  padding: 0.85rem 1.5rem;
  font: inherit;
  font-weight: 800;
  font-size: 1rem;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.btn:active {
  transform: scale(0.97);
}

.btn--teal {
  background: var(--teal);
  color: #fff;
}

.btn--accent {
  background: var(--accent);
  color: var(--accent-ink);
}

.btn--sky {
  background: var(--sky);
  color: #04222e;
}

.btn--ghost {
  background: transparent;
  color: var(--ink-soft);
  padding: 0.5rem;
}

.roster-header h2 {
  margin: 0 0 0.15rem;
  font-family: "Anton", "Manrope", system-ui, sans-serif;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 1.4rem;
  color: var(--teal);
}

.roster-hint {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.88rem;
}

.roster {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}

.roster li {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.5rem 0.6rem;
  border-radius: 10px;
  background: var(--bg);
}

.roster li.is-goalkeeper {
  opacity: 0.65;
}

.roster .number {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
  color: var(--ink-soft);
  width: 1.6rem;
  text-align: right;
}

.roster .name {
  flex: 1;
  font-weight: 700;
}

.roster .gk-chip {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  background: var(--line);
  color: var(--ink-soft);
  border-radius: 999px;
  padding: 0.15rem 0.5rem;
}

.icon-toggle {
  border: none;
  background: transparent;
  font-size: 1.3rem;
  line-height: 1;
  padding: 0.2rem;
  cursor: pointer;
  filter: grayscale(1) opacity(0.4);
}

.icon-toggle[aria-pressed="true"] {
  filter: none;
}

.remove-btn {
  border: none;
  background: transparent;
  color: var(--ink-soft);
  font-size: 1.1rem;
  line-height: 1;
  padding: 0.2rem 0.3rem;
  cursor: pointer;
}

.draw-bar {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-top: 0.25rem;
}

.team-size {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: var(--ink-soft);
}

.team-size input {
  width: 3.5rem;
  font: inherit;
  font-variant-numeric: tabular-nums;
  padding: 0.5rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
}

#draw-btn {
  flex: 1;
}

#result-section {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.teams {
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

.team {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  animation: reveal 0.35s ease both;
}

.team + .team {
  animation-delay: 0.08s;
}

.team__stripe {
  height: 6px;
}

.team__body {
  padding: 1rem 1.1rem;
}

.team__body h3 {
  margin: 0 0 0.5rem;
  font-family: "Anton", "Manrope", system-ui, sans-serif;
  font-weight: 400;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  font-size: 1.2rem;
}

.team__body ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.team__body li {
  font-weight: 700;
}

.team__body li .seed-mark {
  color: var(--accent);
}

.goalkeepers-note {
  margin: 0;
  padding: 0.75rem 1rem;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.share-panel textarea {
  font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
  font-size: 0.85rem;
}

.share-actions {
  display: flex;
  gap: 0.6rem;
}

.share-actions .btn {
  flex: 1;
}

@media (prefers-reduced-motion: reduce) {
  .team {
    animation: none;
  }
}

@keyframes reveal {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

  </style>

      <div class="card share-panel">
        <label for="share-text">Resultado pra colar no grupo</label>
        <textarea id="share-text" readonly rows="7"></textarea>
        <div class="share-actions">
          <button id="copy-btn" class="btn btn--accent">Copiar texto</button>
          <button id="native-share-btn" class="btn btn--sky" hidden>Compartilhar</button>
        </div>
      </div>
    </section>
  </main>
<script>
function shuffle(list) {
  const result = [...list];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

// Round-robins `pool` into `teams`, skipping any team already at `teamSize`.
// Players that don't fit anywhere (all teams full) land in reserves.
function distribute(pool, teams, teamSize, startIndex) {
  const reserves = [];
  let index = startIndex;
  for (const player of pool) {
    let skipped = 0;
    while (teams[index % teams.length].length >= teamSize && skipped < teams.length) {
      index++;
      skipped++;
    }
    if (skipped >= teams.length) {
      reserves.push(player);
    } else {
      teams[index % teams.length].push(player);
      index++;
    }
  }
  return { nextIndex: index, reserves };
}

/**
 * Draws balanced teams from a player list. Seeded players ("cabeças de
 * chave") are spread one per team before the rest of the pool is shuffled
 * in, so the strongest players don't stack on one side.
 *
 * The number of teams is derived from how many players fit per team
 * (ceil(total / teamSize)), so a game can land on 2, 3 or 4 teams and the
 * shortest one just ends up with fewer players instead of anyone sitting
 * out as a "reserve".
 *
 * @param {{name: string, isSeed?: boolean}[]} players
 * @param {{teamSize?: number, numberOfTeams?: number}} [options]
 */
function drawTeams(players, options = {}) {
  if (players.length === 0) {
    throw new Error("Adicione jogadores antes de sortear.");
  }

  const teamSize = options.teamSize ?? 5;
  if (!Number.isInteger(teamSize) || teamSize < 1) {
    throw new Error("O número de jogadores por time precisa ser um inteiro positivo.");
  }

  const numberOfTeams = options.numberOfTeams ?? Math.max(1, Math.ceil(players.length / teamSize));
  if (!Number.isInteger(numberOfTeams) || numberOfTeams < 1) {
    throw new Error("O número de times precisa ser um inteiro positivo.");
  }

  const seeds = shuffle(players.filter((p) => p.isSeed));
  const rest = shuffle(players.filter((p) => !p.isSeed));

  const teams = Array.from({ length: numberOfTeams }, () => []);
  const seedResult = distribute(seeds, teams, teamSize, 0);
  const restResult = distribute(rest, teams, teamSize, seedResult.nextIndex);

  // Largest team first, so a short-handed team naturally reads as "the last one".
  const orderedTeams = teams
    .slice()
    .sort((a, b) => b.length - a.length)
    .map((teamPlayers, i) => ({ name: `Time ${i + 1}`, players: teamPlayers }));

  return {
    teams: orderedTeams,
    reserves: [...seedResult.reserves, ...restResult.reserves],
  };
}

if (typeof module !== "undefined" && module.exports) {
  module.exports = { drawTeams };
} else {
  window.drawTeams = drawTeams;
}

</script>
<script>
let players = [];

const rosterSection = document.getElementById("roster-section");
const resultSection = document.getElementById("result-section");
const playerList = document.getElementById("player-list");
const drawResult = document.getElementById("draw-result");
const goalkeepersNote = document.getElementById("goalkeepers-note");

// Lines a pasted WhatsApp message often has besides the actual roster
// (event header, address, pix key, "aguardando" list, ...). Filtered out
// so only player names make it into the checklist.
const NOISE_WORDS = [
  "confirmado", "confirmados", "confirmação", "confirmacao",
  "pelada", "racha", "society", "quadra", "campo", "estádio", "estadio",
  "local", "endereço", "endereco", "horário", "horario", "data",
  "valor", "pix", "rateio", "obs", "observação", "observacao",
  "aguardando", "espera", "lista", "grupo", "galera", "pessoal",
  "presença", "presenca", "vagas", "regras", "avisos",
];

const GOALKEEPER_PATTERN = /\(?\s*(goleiro|goleira|gol|gk)\s*\)?|🧤/i;

function looksLikeHeader(line) {
  if (/:\s*$/.test(line)) return true;
  const lower = line.toLowerCase();
  return NOISE_WORDS.some((word) => new RegExp(`\\b${word}\\b`, "i").test(lower));
}

function extractGoalkeeper(rawName) {
  const isGoalkeeper = GOALKEEPER_PATTERN.test(rawName);
  const name = rawName
    .replace(GOALKEEPER_PATTERN, "")
    .replace(/[-–—()[\]]+\s*$/, "")
    .replace(/\s{2,}/g, " ")
    .trim();
  return { name, isGoalkeeper };
}

function parsePlayers(text) {
  let lines = text.split("\n").map((l) => l.trim()).filter(Boolean);

  if (lines.length === 1 && lines[0].includes(",")) {
    lines = lines[0].split(",").map((l) => l.trim()).filter(Boolean);
  }

  return lines
    .map((line) => line.replace(/^\s*(\d+[.)-]|[-*•])\s*/, "").trim())
    .filter((line) => line && /[a-zA-ZÀ-ÿ]/.test(line) && !looksLikeHeader(line))
    .map(extractGoalkeeper)
    .filter((p) => p.name);
}

function renderRoster() {
  playerList.innerHTML = "";
  players.forEach((player, index) => {
    const li = document.createElement("li");
    li.classList.toggle("is-goalkeeper", player.isGoalkeeper);

    const number = document.createElement("span");
    number.className = "number";
    number.textContent = index + 1;
    li.appendChild(number);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = player.name;
    li.appendChild(name);

    if (player.isGoalkeeper) {
      const chip = document.createElement("span");
      chip.className = "gk-chip";
      chip.textContent = "GOL";
      li.appendChild(chip);
    }

    const gkToggle = document.createElement("button");
    gkToggle.type = "button";
    gkToggle.className = "icon-toggle";
    gkToggle.textContent = "🧤";
    gkToggle.setAttribute("aria-pressed", String(player.isGoalkeeper));
    gkToggle.setAttribute("aria-label", `Marcar ${player.name} como goleiro`);
    gkToggle.addEventListener("click", () => {
      player.isGoalkeeper = !player.isGoalkeeper;
      renderRoster();
    });
    li.appendChild(gkToggle);

    const star = document.createElement("button");
    star.type = "button";
    star.className = "icon-toggle";
    star.textContent = "⭐";
    star.setAttribute("aria-pressed", String(player.isSeed));
    star.setAttribute("aria-label", `Marcar ${player.name} como cabeça de chave`);
    star.addEventListener("click", () => {
      player.isSeed = !player.isSeed;
      star.setAttribute("aria-pressed", String(player.isSeed));
    });
    li.appendChild(star);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "remove-btn";
    remove.textContent = "✕";
    remove.setAttribute("aria-label", `Remover ${player.name} da lista`);
    remove.addEventListener("click", () => {
      players.splice(index, 1);
      renderRoster();
    });
    li.appendChild(remove);

    playerList.appendChild(li);
  });
}

function formatShareText(draw, goalkeepers) {
  const lines = ["⚽ Sorteio de Times"];
  for (const team of draw.teams) {
    lines.push("", team.name.toUpperCase(), ...team.players.map((p) => `- ${p.name}${p.isSeed ? " ⭐" : ""}`));
  }
  if (goalkeepers.length) {
    lines.push("", `🧤 Goleiros (fora do sorteio): ${goalkeepers.map((p) => p.name).join(", ")}`);
  }
  return lines.join("\n");
}

function renderDraw(draw, goalkeepers) {
  drawResult.innerHTML = "";
  draw.teams.forEach((team, i) => {
    const card = document.createElement("article");
    card.className = "team";

    const stripe = document.createElement("div");
    stripe.className = "team__stripe";
    stripe.style.background = `var(--team-${(i % 6) + 1})`;
    card.appendChild(stripe);

    const body = document.createElement("div");
    body.className = "team__body";

    const title = document.createElement("h3");
    title.textContent = `${team.name} · ${team.players.length}`;
    body.appendChild(title);

    const ul = document.createElement("ul");
    for (const player of team.players) {
      const li = document.createElement("li");
      li.textContent = player.name;
      if (player.isSeed) {
        const mark = document.createElement("span");
        mark.className = "seed-mark";
        mark.textContent = " ⭐";
        li.appendChild(mark);
      }
      ul.appendChild(li);
    }
    body.appendChild(ul);

    card.appendChild(body);
    drawResult.appendChild(card);
  });

  if (goalkeepers.length) {
    goalkeepersNote.hidden = false;
    goalkeepersNote.textContent = `🧤 Fora do sorteio: ${goalkeepers.map((p) => p.name).join(", ")}`;
  } else {
    goalkeepersNote.hidden = true;
  }

  document.getElementById("share-text").value = formatShareText(draw, goalkeepers);
  document.getElementById("native-share-btn").hidden = !navigator.share;

  resultSection.hidden = false;
  resultSection.scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("load-btn").addEventListener("click", () => {
  const parsed = parsePlayers(document.getElementById("paste-area").value);
  players = parsed.map((p) => ({ name: p.name, isGoalkeeper: p.isGoalkeeper, isSeed: false }));
  resultSection.hidden = true;
  rosterSection.hidden = players.length === 0;
  renderRoster();
});

document.getElementById("draw-btn").addEventListener("click", () => {
  const teamSize = Number(document.getElementById("team-size").value) || 5;
  const goalkeepers = players.filter((p) => p.isGoalkeeper);
  const outfield = players.filter((p) => !p.isGoalkeeper);
  try {
    renderDraw(drawTeams(outfield, { teamSize }), goalkeepers);
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById("clear-btn").addEventListener("click", () => {
  players = [];
  document.getElementById("paste-area").value = "";
  rosterSection.hidden = true;
  resultSection.hidden = true;
  playerList.innerHTML = "";
  drawResult.innerHTML = "";
});

document.getElementById("copy-btn").addEventListener("click", async (e) => {
  // Capture before any `await` — e.currentTarget is cleared once the
  // synchronous dispatch phase ends, so reading it after an await gives null.
  const button = e.currentTarget;
  const textarea = document.getElementById("share-text");
  textarea.focus();
  textarea.select();
  textarea.setSelectionRange(0, textarea.value.length);

  let copied = false;
  try {
    await navigator.clipboard.writeText(textarea.value);
    copied = true;
  } catch (err) {
    try {
      copied = document.execCommand("copy");
    } catch (err2) {
      copied = false;
    }
  }

  const original = button.textContent;
  button.textContent = copied ? "Copiado!" : "Texto selecionado — copie manualmente";
  setTimeout(() => {
    button.textContent = original;
  }, 2500);
});

document.getElementById("native-share-btn").addEventListener("click", async () => {
  const text = document.getElementById("share-text").value;
  try {
    await navigator.share({ title: "Sorteio de Times", text });
  } catch (err) {
    // Cancelado ou bloqueado: o texto já está visível/selecionável no campo acima.
  }
});

</script>
</body>
</html>
